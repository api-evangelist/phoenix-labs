description: 'Phoenix Labs is an independent video game developer with studios in Vancouver
  and Montreal, building immersive online worlds and community-driven games. Its titles
  include the free-to-play action RPG Dauntless and the cozy life-sim Fae Farm. The
  studio operates player-facing support and account services for its games but does
  not publish a public developer platform, API program, or SDKs. This profile was surfaced
  as a portfolio company of Sapphire Ventures and enriched into the API Evangelist network;
  its API surface is currently none.'
